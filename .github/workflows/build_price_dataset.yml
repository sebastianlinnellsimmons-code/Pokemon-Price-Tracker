# Save this file as .github/workflows/build_price_dataset.yml in your repo.
#
# Setup (one-time):
#   1. Create a GitHub repo and push build_price_dataset.py to it.
#   2. In the repo: Settings -> Secrets and variables -> Actions -> New repository secret
#        Name:  POKEMONTCG_API_KEY
#        Value: (your key — rotate it first if it's ever been shared in plaintext)
#   3. Commit this file at .github/workflows/build_price_dataset.yml
#
# After that, it runs automatically every day and commits ONE small new file
# per day into data/daily/ — no computer needs to be left on, and no single
# file ever grows large enough to hit GitHub's 100MB-per-file limit.

name: Build Pokemon Price Dataset

on:
  schedule:
    - cron: "0 6 * * *"   # 6:00 UTC daily — adjust to your preferred time
  workflow_dispatch:        # lets you also trigger it manually from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Confirm dependencies installed correctly
        run: |
          python -c "
          import requests, pandas, numpy
          print('requests', requests.__version__)
          print('pandas', pandas.__version__)
          print('numpy', numpy.__version__)
          "

      - name: Run fetch
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python build_price_dataset.py --data-dir data/daily

      - name: Commit updated dataset
        run: |
          git config user.name "price-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily/
          git diff --staged --quiet || git commit -m "Add price snapshot for $(date -u +%Y-%m-%d)"
          git push
