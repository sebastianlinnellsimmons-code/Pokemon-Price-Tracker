# Save this file as .github/workflows/migrate_to_daily.yml in your repo.
#
# This is a ONE-TIME migration - run it manually once from the Actions tab,
# then you can delete this workflow file afterward (or just leave it unused).
#
# What it does: splits your existing prices_wide_store.csv into the new
# data/daily/ format, removes the old monolithic file, and commits both
# changes - all inside GitHub's servers, no local Python setup needed.

name: Migrate to Daily Files (one-time)

on:
  workflow_dispatch:   # manual trigger only - this should not run automatically

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Run migration
        run: python migrate_to_daily_files.py --input prices_wide_store.csv --output-dir data/daily

      - name: Commit migrated files and remove old store
        run: |
          git config user.name "price-dataset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily/
          git rm --ignore-unmatch prices_wide_store.csv
          git commit -m "Migrate to one-file-per-day format"
          git push
